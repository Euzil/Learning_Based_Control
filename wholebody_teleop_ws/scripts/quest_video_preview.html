<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人头部视角 · MuJoCo</title>
<style>
body{margin:0;background:#10151c;color:#e9eef5;font:16px system-ui,sans-serif}main{max-width:1280px;margin:32px auto;padding:0 24px}h1{font-size:26px;margin-bottom:8px}p{color:#aab8c9;line-height:1.6}video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:12px}header,footer{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}button{background:#344b65;color:white;border:1px solid #536e8c;border-radius:8px;padding:10px 16px;cursor:pointer}#status{color:#83c8ff}#stats{font-variant-numeric:tabular-nums}footer{margin-top:16px}
</style>
<main>
<header><div><h1>机器人头部视角</h1><p>MuJoCo 单目实时画面 · 无需连接 Quest</p></div><button id="reconnect">重新连接</button></header>
<video id="video" autoplay playsinline muted controls></video>
<footer><span id="status" role="status">正在连接视频服务…</span><span id="stats"></span></footer>
<p>这是机器人头部虚拟相机的画面，不是模拟器窗口的观察视角。默认场景主要是地面与天空；此页面仅显示视频，不控制机器人。</p>
</main>
<script>
'use strict';
const video = document.querySelector('#video');
const status = document.querySelector('#status');
const stats = document.querySelector('#stats');
let current = null, retry = null, enabled = true;
function closeSession() {
  const old = current; current = null;
  if (old) { clearTimeout(old.deadline); old.ws.close(); old.pc.close(); }
  video.srcObject = null; stats.textContent = '';
}
function fail(session, text) {
  if (session !== current) return;
  closeSession(); status.textContent = text + '，3 秒后重试…';
  clearTimeout(retry);
  if (enabled) retry = setTimeout(connect, 3000);
}
function connect() {
  clearTimeout(retry); closeSession();
  if (!enabled) return;
  if (!window.RTCPeerConnection) { status.textContent = '此浏览器不支持 WebRTC，请使用 Chrome 或 Firefox。'; return; }
  status.textContent = '正在连接，等待机器人画面…';
  const pc = new RTCPeerConnection({iceServers: []});
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/`);
  const session = {pc, ws, id: `${Date.now()}-${Math.random()}`, deadline: null};
  current = session;
  const send = (type, payload) => {
    if (current === session && ws.readyState === WebSocket.OPEN)
      ws.send(JSON.stringify({type, session_id: session.id, payload}));
  };
  session.deadline = setTimeout(() => fail(session, '未收到可播放的视频，请检查模拟器'), 15000);
  pc.addTransceiver('video', {direction: 'recvonly'});
  pc.onicecandidate = event => {
    if (event.candidate) send('ice_candidate', event.candidate.toJSON());
  };
  pc.ontrack = event => {
    if (current !== session) return;
    video.srcObject = new MediaStream([event.track]);
    video.play().catch(() => { if (current === session) status.textContent = '请点击视频播放按钮'; });
  };
  video.onplaying = () => {
    if (current !== session) return;
    clearTimeout(session.deadline);
    status.textContent = `正在显示 · ${video.videoWidth} × ${video.videoHeight}`;
  };
  pc.onconnectionstatechange = () => {
    if (['failed', 'disconnected'].includes(pc.connectionState)) fail(session, '视频连接中断');
  };
  ws.onopen = async () => {
    try {
      send('hello', {client_name: 'browser_preview', video_preset: '720p30'});
      send('start_video', {});
      await pc.setLocalDescription(await pc.createOffer());
      send('offer', {sdp: pc.localDescription.sdp});
    } catch (error) { fail(session, error.message); }
  };
  ws.onmessage = async event => {
    if (current !== session) return;
    try {
      const message = JSON.parse(event.data);
      if (message.session_id !== session.id) return;
      const p = message.payload;
      if (message.type === 'answer') await pc.setRemoteDescription({type: 'answer', sdp: p.sdp});
      else if (message.type === 'ice_candidate') await pc.addIceCandidate(p);
      else if (message.type === 'error') fail(session, p.message || '视频源不可用');
      else if (message.type === 'stats') stats.textContent = `${Number(p.fps).toFixed(1)} fps · ${Number(p.bitrate_kbps).toFixed(0)} kbps`;
    } catch (error) { fail(session, error.message); }
  };
  ws.onclose = () => fail(session, '视频服务已停止');
  ws.onerror = () => fail(session, '无法连接视频服务');
}
document.querySelector('#reconnect').onclick = connect;
window.addEventListener('pagehide', () => { enabled = false; clearTimeout(retry); closeSession(); });
window.addEventListener('pageshow', () => { enabled = true; if (!current) connect(); });
connect();
</script>
</html>
