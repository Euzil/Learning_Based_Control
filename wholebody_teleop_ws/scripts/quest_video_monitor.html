<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>机器人相机监控</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#10151c;color:#e9eef5;font:16px system-ui,sans-serif}main{max-width:1040px;margin:32px auto;padding:0 24px}header,footer{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{font-size:26px}p{line-height:1.6;color:#aab8c9}img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#05080c;border-radius:12px}button,a{color:#d7eaff}button{padding:10px 16px;border:1px solid #536e8c;border-radius:8px;background:#344b65;cursor:pointer}#status{color:#83c8ff}#status[data-stale=true]{color:#ffbf70}footer{margin-top:16px}img[data-stale=true]{opacity:.6}
</style>
<main>
<header><h1>机器人相机监控</h1><button id="toggle">暂停刷新</button></header>
<p>显示机器人头部相机，每秒最多刷新两次。适合远程观察与调试，不控制机器人。</p>
<img id="frame" alt="等待机器人相机画面" hidden>
<footer><span id="status" role="status" aria-live="polite">正在连接…</span><a href="health" target="_blank" rel="noopener">查看相机状态</a></footer>
<p>画面超过 2 秒未更新时会变暗并提示延迟。浏览器刷新速度不代表仿真或相机帧率。</p>
</main>
<script>
'use strict';
const frame=document.querySelector('#frame'), status=document.querySelector('#status'), toggle=document.querySelector('#toggle');
let enabled=true, timer=null, controller=null, url=null, busy=false;
function mark(text, stale){status.textContent=text; status.dataset.stale=String(stale); frame.dataset.stale=String(stale);}
async function refresh(){
  if(!enabled || document.hidden || busy)return;
  busy=true; controller=new AbortController();
  const deadline=setTimeout(()=>controller?.abort(),5000);
  try{
    const response=await fetch('snapshot.jpg',{cache:'no-store',signal:controller.signal});
    if(!response.ok)throw new Error(response.status===503?'等待相机图像':'视频服务暂时不可用');
    const blob=await response.blob();
    if(!enabled || document.hidden)return;
    const next=URL.createObjectURL(blob), previous=url; url=next;
    frame.src=next; frame.alt='机器人头部相机画面'; frame.hidden=false; if(previous)URL.revokeObjectURL(previous);
    const age=Number(response.headers.get('X-Frame-Age')), seq=response.headers.get('X-Frame-Sequence');
    mark(age>2?`画面未及时更新 · ${age.toFixed(1)} 秒前 · 帧 ${seq}`:`相机画面 · ${age.toFixed(1)} 秒前 · 帧 ${seq}`,age>2);
  }catch(error){if(enabled && !document.hidden)mark(error.name==='AbortError'?'连接超时，正在重试…':error.message,true);}
  finally{clearTimeout(deadline);controller=null;busy=false;if(enabled && !document.hidden)timer=setTimeout(refresh,500);}
}
function restart(){clearTimeout(timer);if(enabled&&!document.hidden&&!busy)refresh();}
toggle.onclick=()=>{enabled=!enabled;toggle.textContent=enabled?'暂停刷新':'继续刷新';if(enabled)restart();else{clearTimeout(timer);controller?.abort();mark('已暂停 · 当前为最后收到的画面',true);}};
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(timer);controller?.abort();}else restart();});
window.addEventListener('pagehide',()=>{enabled=false;clearTimeout(timer);controller?.abort();if(url){URL.revokeObjectURL(url);url=null;}});
window.addEventListener('pageshow',()=>{enabled=true;toggle.textContent='暂停刷新';restart();});
restart();
</script>
</html>
